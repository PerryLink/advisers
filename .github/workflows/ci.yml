name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository (cache actions use their own
# runtime tokens). No step needs a write-scoped GITHUB_TOKEN.
permissions:
  contents: read

# Supply-chain hardening: every action is pinned to a full commit SHA. The
# comment records the upstream release tag; bump the SHA and the comment
# together (Dependabot/Renovate may open the bump, review it before merging).
# Prefer pinning to a SHA over a mutable major tag.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.16 is the exact minimum: Node 22.13-22.15 ship node:sqlite without FTS5.
        node: ['22.16', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      # 0.3.0 deterministic gates (no model key, no network), run after the
      # workspace build because they exercise the built CLI/dist:
      #   - eval:det is the deterministic eval contract (docs/EVAL.md);
      #   - check-contracts validates the machine-readable contracts under
      #     contracts/ against the real CLI/MCP (docs/CONTRACTS.md);
      #   - sbom regenerates the lockfile-derived CycloneDX artifact and
      #     check:sbom validates it (docs/SBOM.md). Use `pnpm run sbom`, not
      #     `pnpm sbom`: pnpm resolves its built-in sbom command before a
      #     script of the same name.
      - name: Deterministic eval suite
        run: pnpm eval:det
      - name: Interface contracts gate
        run: node scripts/check-contracts.mjs
      - name: SBOM generate and check
        run: pnpm run sbom && pnpm run check:sbom
      # Static checks for the production JS under packages/* (syntax via
      # node --check, forbidden eval/Function and shell exec, hardcoded secret
      # material). Fast and dependency-free; see scripts/check-js.mjs.
      - run: node scripts/check-js.mjs
      - run: pnpm -r --if-present run test
      # Fault-injection suite: SIGKILL mid-transaction, WAL corruption, FTS
      # desync, migration rollback, ENOSPC. Linux-only cases SKIP cleanly on
      # other platforms (see docs/FAULT-INJECTION.md). Runs once, on the
      # minimum supported Node, to keep the matrix fast.
      - name: Fault-injection suite
        if: matrix.node == '22.16'
        run: node scripts/fault-injection.mjs
      - run: node scripts/pack-smoke.mjs
      - run: node scripts/check-docs.mjs
      - run: node scripts/check-licenses.mjs
      - run: node scripts/check-tos.mjs
      - run: node scripts/check-release.mjs
      - run: node scripts/verify-office.mjs
      - run: node scripts/security-suite.mjs
      # Supply-chain audit gate against the official npm registry. WARN-only for
      # now: the script prints PASS/WARN and exits 0 unless --strict is passed,
      # and continue-on-error keeps a registry/audit-endpoint outage from
      # blocking CI. Promote to blocking later by removing continue-on-error and
      # passing --strict once the tracked advisories are fixed or re-waived.
      - run: node scripts/check-deps.mjs
        continue-on-error: true

  windows-smoke:
    # 0.2.3 Wave 4a: the product is Windows-first (README/QUICKSTART) but CI
    # only ran Linux, so Windows path/rename/lock/CRLF behaviour was never
    # observed by a gate. This job is a smoke job, not the full suite: frozen
    # install + build + the packaging smoke + a minimal CLI flow on a fresh
    # temporary ADVISERS_HOME. It deliberately does not need Office/Word (no
    # verify-office step and no office commands below). Failures print the
    # failing command, its output, the tool versions and the temporary home
    # contents so a Windows-only failure is diagnosable from the job log alone.
    # 0.2.4 Windows P0 (0.3 research §4.1/R1): the CLI flow also exercises the
    # durable-write paths that fsync a plaintext copy (backup, export --out,
    # import --replace, vault seal/unseal). lib/fs-safe.js used to fsync a
    # read-only handle, which Windows rejects with EPERM; those commands were
    # broken on real Windows until that fix, so they are now release-gated here.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - name: Pack dry-run smoke
        run: node scripts/pack-smoke.mjs
      - name: Docs/release gates (Windows fileURLToPath portability)
        run: |
          node scripts/check-docs.mjs
          node scripts/check-release.mjs
      - name: Minimal CLI smoke on a temporary ADVISERS_HOME
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep native exit codes as data; we check them explicitly below.
          $PSNativeCommandUseErrorActionPreference = $false
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("advisers-smoke-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          $env:ADVISERS_HOME = Join-Path $smokeRoot 'home'
          $env:ADVISERS_STORE = 'sqlite'
          $env:ADVISERS_ACCEPT_TOS = '1'
          $env:ADVISERS_NO_MODEL = '1'
          $env:ADVISERS_CORE_LOCAL = '1'
          $env:ADVISERS_OFFICE_LOCAL = '1'
          $bin = Join-Path (Get-Location) 'packages/advisers/bin/advisers.js'

          function Show-Diagnostics {
            Write-Host '--- windows-smoke diagnostics ---'
            Write-Host ("node: " + (& node --version))
            Write-Host ("pnpm: " + (& pnpm --version))
            Write-Host ("cwd: " + (Get-Location))
            Write-Host ("ADVISERS_HOME: " + $env:ADVISERS_HOME)
            if ($env:ADVISERS_HOME -and (Test-Path -LiteralPath $env:ADVISERS_HOME)) {
              Get-ChildItem -LiteralPath $env:ADVISERS_HOME -Force |
                ForEach-Object { Write-Host ("home/" + $_.Name + " bytes=" + $_.Length) }
            }
          }

          function Invoke-Advisers {
            param([string]$Label, [string[]]$Arguments)
            Write-Host ("=== advisers " + ($Arguments -join ' ') + "  [" + $Label + "]")
            $output = (& node $bin @Arguments 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $output.TrimEnd()
            if ($code -ne 0) {
              Write-Host ("::error::" + $Label + " failed with exit code " + $code)
              Show-Diagnostics
              exit 1
            }
            return $output
          }

          $versionOutput = Invoke-Advisers 'version' @('--version')
          if ($versionOutput -notmatch '(?m)^\d+\.\d+\.\d+') {
            Write-Host '::error::advisers --version did not print a semantic version'
            Show-Diagnostics
            exit 1
          }
          $null = Invoke-Advisers 'init' @('init')
          $null = Invoke-Advisers 'status' @('status')
          $message = 'Windows smoke commitment'
          $null = Invoke-Advisers 'commit-add' @('commit', 'add', $message, '--quote', $message)
          $commitList = Invoke-Advisers 'commit-ls' @('commit', 'ls')
          if ($commitList -notmatch [regex]::Escape($message)) {
            Write-Host '::error::commit ls does not show the commitment that was just added'
            Show-Diagnostics
            exit 1
          }
          $doctor = Invoke-Advisers 'doctor' @('doctor')
          if ($doctor -match '(?m)^FAIL\s') {
            Write-Host '::error::advisers doctor reported FAIL checks'
            Show-Diagnostics
            exit 1
          }
          $null = Invoke-Advisers 'doctor-check-db' @('doctor', '--check-db')

          # --- Windows P0 durable-write regression (0.3 research §4.1/R1) ---
          # These commands fsync a plaintext copy through lib/fs-safe.js. Before
          # the fix they failed on Windows with "EPERM: operation not permitted,
          # fsync" because the file was opened read-only before fsync; the fix
          # opens a writable, non-truncating handle. Order matters: backup copies
          # the current DB, export produces the ledger that import --replace
          # consumes, and vault seal/unseal round-trips the database. Any failure
          # here is a release blocker, so print the command output and the
          # temporary-home contents.
          $backupFile = Join-Path $smokeRoot 'smoke-backup.db'
          $exportFile = Join-Path $smokeRoot 'smoke-export.json'
          $vaultFile = Join-Path $smokeRoot 'smoke-state.vault'

          $null = Invoke-Advisers 'backup' @('backup', $backupFile)
          if (-not (Test-Path -LiteralPath $backupFile -PathType Leaf) -or (Get-Item -LiteralPath $backupFile).Length -le 0) {
            Write-Host '::error::advisers backup did not create a non-empty backup file'
            Show-Diagnostics
            exit 1
          }

          $null = Invoke-Advisers 'export-out' @('export', '--out', $exportFile)
          if (-not (Test-Path -LiteralPath $exportFile -PathType Leaf) -or (Get-Item -LiteralPath $exportFile).Length -le 0) {
            Write-Host '::error::advisers export --out did not create a non-empty JSON export'
            Show-Diagnostics
            exit 1
          }

          $null = Invoke-Advisers 'import-replace' @('import', $exportFile, '--replace')
          $importBackups = @(Get-ChildItem -LiteralPath $env:ADVISERS_HOME -Filter 'import-backup-*.db' -File -ErrorAction SilentlyContinue)
          if ($importBackups.Count -lt 1) {
            Write-Host '::error::advisers import --replace did not keep a pre-import recovery backup'
            Show-Diagnostics
            exit 1
          }

          $env:ADVISERS_VAULT_PASSPHRASE = 'windows-smoke-vault-passphrase'
          $null = Invoke-Advisers 'vault-seal' @('vault', 'seal', '--out', $vaultFile)
          if (-not (Test-Path -LiteralPath $vaultFile -PathType Leaf) -or (Get-Item -LiteralPath $vaultFile).Length -le 0) {
            Write-Host '::error::advisers vault seal did not create a non-empty vault file'
            Show-Diagnostics
            exit 1
          }

          $null = Invoke-Advisers 'vault-unseal' @('vault', 'unseal', $vaultFile)
          $unsealBackups = @(Get-ChildItem -LiteralPath $env:ADVISERS_HOME -Filter 'state.db.before-unseal-*' -File -ErrorAction SilentlyContinue)
          if ($unsealBackups.Count -lt 1) {
            Write-Host '::error::advisers vault unseal did not keep a pre-unseal backup'
            Show-Diagnostics
            exit 1
          }
          $afterUnseal = Invoke-Advisers 'commit-ls-after-unseal' @('commit', 'ls')
          if ($afterUnseal -notmatch [regex]::Escape($message)) {
            Write-Host '::error::commit ls after vault unseal does not show the seeded commitment'
            Show-Diagnostics
            exit 1
          }

          # The fsync fix must not leave staged temp files behind. SQLite may leave
          # <staged-unseal>-wal/-shm sidecars while verifying the image (pre-existing
          # plaintext artifacts reported by `vault status`), so only the staged file
          # itself and the fs-safe ".tmp-*" names count as residue here.
          $leftover = @(Get-ChildItem -LiteralPath $env:ADVISERS_HOME -Force -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -like '*tmp-*' -or
              ($_.Name -like '.state.db.unseal-*' -and $_.Name -notlike '*-wal' -and $_.Name -notlike '*-shm')
            })
          if ($leftover.Count -gt 0) {
            Write-Host ('::error::durable-write temp files left in ADVISERS_HOME: ' + (($leftover | ForEach-Object { $_.Name }) -join ', '))
            Show-Diagnostics
            exit 1
          }

          Write-Host 'windows smoke: PASS (--version, init, status, commit add/ls, doctor, doctor --check-db, backup, export --out, import --replace, vault seal/unseal)'
          Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue

  windows-full:
    # 0.4.0: full Windows test suite. The windows-smoke job above only covers the
    # CLI/durable-write smoke; this job runs the workspace build, typecheck and
    # every package's test files on Windows so path/mode/rename/signal
    # regressions are seen by CI instead of only on a real machine.
    #
    # windows-latest is currently a Windows Server 2025 image: it does not
    # replace the manual real-client verification (IME/Terminal/OneDrive/Office;
    # docs/WINDOWS.md) but it does keep the full suite honest.
    #
    # 0.4.0 starts report-only: the 2026-11-21 real-machine run has 34 known
    # Windows-only failures (fixture/POSIX assumptions and product/local
    # semantics; tracked in the release checklist's Windows triage). Flip this to
    # blocking by deleting continue-on-error once those fixtures are fixed and
    # this job is green on main; keep windows-smoke green throughout.
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # 22.16 is the exact minimum: Node 22.13-22.15 ship node:sqlite without FTS5.
        node: ['22.16', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - run: node scripts/check-js.mjs
      # Windows cmd does not expand the "test/*.test.js" glob that the package
      # scripts pass to "node --test", so enumerate the files in PowerShell and
      # invoke the test runner directly (the same files the Linux pnpm test step
      # runs). Keep going after a failing package so one run reports every
      # failure instead of stopping at the first.
      - name: Full test suite (all packages)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = [System.Collections.Generic.List[string]]::new()
          foreach ($pkg in Get-ChildItem -Path 'packages' -Directory) {
            $pkgName = $pkg.Name
            $testDir = Join-Path $pkg.FullName 'test'
            if (-not (Test-Path -LiteralPath $testDir -PathType Container)) { continue }
            $files = @(Get-ChildItem -LiteralPath $testDir -File |
              Where-Object { $_.Name -match '\.test\.(js|ts)$' } |
              ForEach-Object { $_.FullName })
            if ($files.Count -eq 0) { continue }
            Write-Host ("=== " + $pkgName + ": " + $files.Count + " test file(s)")
            Push-Location -LiteralPath $pkg.FullName
            try {
              & node --experimental-strip-types --test --test-reporter=spec $files
              if ($LASTEXITCODE -ne 0) {
                $failed.Add($pkgName)
                Write-Host ("::error::" + $pkgName + " tests failed (exit " + $LASTEXITCODE + ")")
              }
            } finally {
              Pop-Location
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host ("::error::windows-full failed for: " + ($failed -join ', '))
            exit 1
          }
          Write-Host 'windows full: PASS (build, typecheck, every package test file)'
      - name: Pack dry-run smoke
        run: node scripts/pack-smoke.mjs
      - name: Portable bundle self-tests
        run: |
          node scripts/portable-zip.mjs --self-test
          node scripts/pack-portable.mjs --self-test
