name: publish
on:
  workflow_dispatch:
    # Publication is human-OTP staged approval; do not re-enable tag triggers
    # until Trusted Publishing is configured for all packages.
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test
      - run: node scripts/release.mjs
        env:
          RELEASE_TAG: next
