name: release-gate

# Manual release gate plus an opt-in Trusted Publishing staging path.
#
# The `gate` job runs the full release checks and NEVER publishes or stages.
#
# The `trusted-publish-draft` job is opt-in (workflow_dispatch input
# confirm=yes) and grants `id-token: write` so npm can exchange the GitHub OIDC
# token for a short-lived credential:
#   confirm=yes, stage=no   -> OIDC reachability check and a
#                              `release.mjs --dry-run --provenance` diagnostic
#                              run. Nothing is staged.
#   confirm=yes, stage=yes  -> runs `node scripts/release.mjs --provenance`,
#                              which uploads a stage for each of the six
#                              packages with npm build-provenance attestations.
#                              It still does NOT publish: the npm account owner
#                              approves every stage with their own OTP.
#
# CI staging requires the owner to configure an npm Trusted Publisher for each
# package on npmjs.com (owner decision, not stored in this repository). The
# staging step refuses to run if NPM_TOKEN is set, so a long-lived token cannot
# silently replace OIDC authentication, and it prints the tail of the npm debug
# log when staging fails.
#
# Supply-chain hardening: every action is pinned to a full commit SHA; the
# comment records the upstream release tag. Bump the SHA and the comment
# together.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "planned npm dist-tag (latest or next)"
        required: true
        default: latest
        type: choice
        options: [latest, next]
      confirm:
        description: "run the trusted-publishing OIDC job"
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]
      stage:
        description: "stage the six packages with provenance (requires confirm=yes; never publishes)"
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]
      publish:
        description: "direct OIDC+provenance publish; validates a Pending-validation Trusted Publisher (requires confirm=yes)"
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test
      - run: node scripts/pack-smoke.mjs
      - run: node scripts/check-docs.mjs
      - run: node scripts/check-release.mjs --stable --require-tag
      - run: node scripts/check-licenses.mjs
      - run: node scripts/check-tos.mjs --release
      - run: node scripts/security-suite.mjs
      - run: node scripts/verify-office.mjs
      # WARN-only dependency audit gate; policy is documented in ci.yml.
      - run: node scripts/check-deps.mjs
        continue-on-error: true
      - name: Manual publish instructions
        run: |
          echo "Gate passed for tag ${{ inputs.release_tag }}."
          echo ""
          echo "Two staged-release paths exist; neither one publishes automatically:"
          echo ""
          echo "1) Local staged release (existing path, no provenance):"
          echo "     RELEASE_TAG=${{ inputs.release_tag }} NPM_TOKEN=... node scripts/release.mjs"
          echo "   Then approve each stage id in your own terminal (OTP is human-only)."
          echo ""
          echo "2) CI Trusted Publishing with provenance (owner-authorized):"
          echo "     dispatch this workflow with confirm=yes and stage=yes"
          echo "   That runs: RELEASE_TAG=${{ inputs.release_tag }} node scripts/release.mjs --provenance"
          echo "   No NPM_TOKEN is accepted on that path; OIDC supplies the short-lived credential."
          echo "   Approval is still manual: npm stage approve <stage-id> in the owner's terminal."
          echo ""
          echo "If CI staging fails, the staging step prints the tail of the npm debug log."

  trusted-publish-draft:
    # Opt-in via confirm=yes. With stage=yes this job DOES stage the six packages
    # through npm Trusted Publishing with provenance (OIDC); without stage=yes it
    # only runs the diagnostic dry run. It never publishes: approval of every
    # staged build remains the npm account owner's explicit action.
    # Requires an npm Trusted Publisher per package and no NPM_TOKEN.
    needs: gate
    if: ${{ inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # If the npmjs Trusted Publisher entry names a GitHub environment, use the
    # same name here (and require reviewers on that environment for a human gate):
    # environment: npm-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OIDC token endpoint reachable (token is not printed)
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "::error::OIDC request environment is missing; this job needs permissions: id-token: write"
            exit 1
          fi
          sep="?"
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
            *"?"*) sep="&" ;;
          esac
          status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=npm:registry.npmjs.org")"
          echo "OIDC token endpoint: HTTP ${status} (token not printed)"
          test "${status}" = "200"
      - name: Provenance dry-run (diagnostic; nothing is staged)
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "Running: node scripts/release.mjs --dry-run --provenance"
          echo "This exercises the npm --provenance / OIDC path. It is expected to fail or"
          echo "warn until a Trusted Publisher is configured for every package."
          node scripts/release.mjs --dry-run --provenance
      - name: Stage with Trusted Publishing + provenance (owner-authorized; never publishes)
        if: ${{ inputs.confirm == 'yes' && inputs.stage == 'yes' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -u
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN must not be set for Trusted Publishing; OIDC supplies the short-lived token"
            exit 1
          fi
          echo "Staging (not publishing) with RELEASE_TAG=${RELEASE_TAG}; OIDC supplies the npm credential."
          set +e
          node scripts/release.mjs --provenance
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::Trusted Publishing staging failed; see the npm debug log below"
            echo '--- npm debug log (tail; npm does not print auth tokens) ---'
            found=0
            for f in "$HOME"/.npm/_logs/*-debug-0.log; do
              if [ -f "$f" ]; then
                found=1
                echo "== $f"
                tail -250 "$f"
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "no npm debug log found under $HOME/.npm/_logs"
            fi
            echo '--- end npm debug log ---'
          fi
          exit "$code"

      - name: Publish directly with Trusted Publishing + provenance (owner-authorized validation)
        if: ${{ inputs.confirm == 'yes' && inputs.publish == 'yes' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -u
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN must not be set for Trusted Publishing; OIDC supplies the short-lived token"
            exit 1
          fi
          echo "Direct publishing (OIDC provenance) with RELEASE_TAG=${RELEASE_TAG}."
          set +e
          node scripts/release.mjs --provenance --publish
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::Trusted Publishing direct publish failed; see the npm debug log below"
            echo '--- npm debug log (tail; npm does not print auth tokens) ---'
            found=0
            for f in "$HOME"/.npm/_logs/*-debug-0.log; do
              if [ -f "$f" ]; then
                found=1
                echo "== $f"
                tail -250 "$f"
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "no npm debug log found under $HOME/.npm/_logs"
            fi
            echo '--- end npm debug log ---'
          fi
          exit "$code"

      - name: Trusted Publisher setup and owner decision (reference)
        run: |
          echo "This step is informational; it does not stage or publish."
          echo "When this dispatch used stage=yes, the stage step above already uploaded"
          echo "stages (it never published them)."
          echo ""
          echo "To enable trusted publishing (owner decision), for EACH of the six packages on npmjs.com:"
          echo "  Settings -> Trusted Publisher -> GitHub Actions"
          echo "    repository:    the GitHub owner/repo that hosts this workflow"
          echo "    workflow file: publish.yml"
          echo "    environment:   empty unless a protected GitHub environment is used (must match)"
          echo "    permission:    allow stage publish (recommended); direct publish only if the owner accepts it"
          echo "  npm CLI on the runner must be >= 11.15.0 for staged publishing with OIDC."
          echo "  Current npm CLI: $(npm --version)"
          echo ""
          echo "Every staged build still needs the owner's explicit approval before it is published:"
          echo "  npm stage approve <stage-id>"
          echo "After approval, verify the registry instead of trusting the workflow output:"
          echo "  node scripts/verify-release.mjs --version <version> --tag ${{ inputs.release_tag }}"

      # The real staging command is the active step above. It stays opt-in behind
      # both confirm=yes and stage=yes so a dispatch can run the gate and the
      # OIDC/provenance diagnostics without uploading anything.
