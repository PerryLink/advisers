name: release-gate

# Manual pre-release gate. This workflow NEVER publishes: staged publishing needs
# the npm account owner's OTP in their own terminal after the stage ids exist.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "planned npm dist-tag (latest or next)"
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test
      - run: node scripts/pack-smoke.mjs
      - run: node scripts/check-docs.mjs
      - run: node scripts/check-release.mjs --stable --require-tag
      - run: node scripts/check-licenses.mjs
      - run: node scripts/check-tos.mjs
      - run: node scripts/security-suite.mjs
      - run: node scripts/verify-office.mjs
      - name: Manual publish instructions
        run: |
          echo "Gate passed for tag ${{ inputs.release_tag }}."
          echo "This workflow does not publish. On a clean tagged checkout run:"
          echo "  RELEASE_TAG=${{ inputs.release_tag }} NPM_TOKEN=... node scripts/release.mjs"
          echo "Then approve each stage id in your own terminal (OTP is human-only)."
